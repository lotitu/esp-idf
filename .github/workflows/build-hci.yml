name: Build ESP32-S3 Zero USB-Dongle Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            examples/bluetooth/hci/controller_hci_uart_esp32

      - name: Inject S3 Native USB-HCI Config
        run: |
          cd examples/bluetooth/hci/controller_hci_uart_esp32
          
          # Aktiviert die Bluetooth-Architektur
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_CONTROLLER_ONLY=y" >> sdkconfig.defaults
          
          # Deaktiviert die physischen Pins (GPIO 43/44)
          echo "CONFIG_BT_LE_HCI_INTERFACE_USE_UART=n" >> sdkconfig.defaults
          
          # Zwingt den BLE-Treiber nativ auf die USB-Buchse (USB-CDC)
          echo "CONFIG_BT_LE_HCI_INTERFACE_USE_USB=y" >> sdkconfig.defaults

          # Code-Fix für das Demoprojekt (Kompilierfehler umgehen)
          sed -i '1s/^/#define CONFIG_BTDM_CTRL_HCI_UART_NO 0\n#define CONFIG_BTDM_CTRL_HCI_UART_BAUDRATE 921600\n/' main/controller_hci_uart_demo.c

      - name: Build Bluetooth HCI
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: 'examples/bluetooth/hci/controller_hci_uart_esp32'

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-hci-binaries
          path: |
            examples/bluetooth/hci/controller_hci_uart_esp32/build/bootloader/bootloader.bin
            examples/bluetooth/hci/controller_hci_uart_esp32/build/partition_table/partition-table.bin
            examples/bluetooth/hci/controller_hci_uart_esp32/build/controller_hci_uart.bin
