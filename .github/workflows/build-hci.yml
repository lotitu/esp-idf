name: Build ESP32-S3 Native USB-HCI Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            examples/bluetooth/hci/hci_usb

      - name: Build Bluetooth Native USB HCI
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: 'examples/bluetooth/hci/hci_usb'

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-usb-hci-binaries
          path: |
            examples/bluetooth/hci/hci_usb/build/bootloader/bootloader.bin
            examples/bluetooth/hci/hci_usb/build/partition_table/partition-table.bin
            examples/bluetooth/hci/hci_usb/build/hci_usb.bin
