name: Build ESP32-C3 HCI Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            examples/bluetooth/hci/controller_hci_uart

      - name: Inject USB UART Config
        run: |
          cd examples/bluetooth/hci/controller_hci_uart
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_CONTROLLER_ONLY=y" >> sdkconfig.defaults
          echo "CONFIG_BT_LE_HCI_INTERFACE_USE_UART=y" >> sdkconfig.defaults
          echo "CONFIG_BT_LE_UART_HCI_PORTS_NUM=0" >> sdkconfig.defaults

      - name: Build Bluetooth HCI
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32c3
          path: 'examples/bluetooth/hci/controller_hci_uart'

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-hci-binaries
          path: |
            examples/bluetooth/hci/controller_hci_uart/build/bootloader/bootloader.bin
            examples/bluetooth/hci/controller_hci_uart/build/partition_table/partition-table.bin
            examples/bluetooth/hci/controller_hci_uart/build/controller_hci_uart.bin
