name: Build ESP32-S3 Zero USB-Dongle Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            examples/bluetooth/hci/hci_uart

      - name: Inject S3 Native USB-HCI Config
        run: |
          cd examples/bluetooth/hci/hci_uart
          
          # Aktiviert die Bluetooth-Architektur
          echo "CONFIG_BT_ENABLED=y" >> sdkconfig.defaults
          echo "CONFIG_BT_CONTROLLER_ONLY=y" >> sdkconfig.defaults
          
          # Schaltet physische Pins ab und leitet HCI auf die USB-Buchse um
          echo "CONFIG_BT_LE_HCI_INTERFACE_USE_UART=n" >> sdkconfig.defaults
          echo "CONFIG_BT_LE_HCI_INTERFACE_USE_USB=y" >> sdkconfig.defaults

      - name: Build Bluetooth HCI
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: 'examples/bluetooth/hci/hci_uart'

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-hci-binaries
          path: |
            examples/bluetooth/hci/hci_uart/build/bootloader/bootloader.bin
            examples/bluetooth/hci/hci_uart/build/partition_table/partition-table.bin
            examples/bluetooth/hci/hci_uart/build/hci_uart.bin
